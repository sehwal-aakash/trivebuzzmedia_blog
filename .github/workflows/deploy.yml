name: 🚀 Deploy TriveBuzzMedia to Server

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v3

      - name: 🔐 Set up SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 🚀 Deploy via SSH
        run: |
          ssh -o StrictHostKeyChecking=no vedeshra.in@ssh.gb.stackcp.com << 'EOF'
            cd public_html/trivebuzzmedia_blog
            git checkout master
            git fetch origin master
            git reset --hard origin/master
            php84 /usr/bin/composer install --ignore-platform-req=ext-mongodb --no-interaction --prefer-dist --optimize-autoloader
            php84 artisan migrate --force
            php84 artisan config:cache
            php84 artisan route:clear
            php84 artisan view:clear
            php84 artisan view:cache
            php84 artisan storage:link
          EOF


